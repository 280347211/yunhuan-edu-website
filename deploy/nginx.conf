# 云幻教育官网 - ECS Nginx 配置
# 部署路径: /etc/nginx/conf.d/yunhuan-edu.conf
#
# 服务架构:
#   Next.js SSR (:3001) → 前端页面（SEO 渲染）
#   Express API (:3000)    → 后端接口
#   MySQL (:3306)         → 数据库

server {
    listen 80;
    server_name magicloudedu.com www.magicloudedu.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name magicloudedu.com www.magicloudedu.com;

    # SSL 证书配置（请替换为实际证书路径）
    # ssl_certificate     /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    # === Gzip 压缩 ===
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1000;

    # === 安全头 ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # === 静态资源（直接由 Nginx 返回，不走 Node.js）===
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # === 上传文件（图片等）→ Express 后端 ===
    location /Uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_valid 200 7d;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # === API 接口 → Express 后端 ===
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # === 前端页面 → Next.js SSR 服务 ===
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_read_timeout 60s;
    }

    # ══════════════════════════════════════
    # SEO 301 重定向：旧 PHP URL → 新 Next.js URL
    # ══════════════════════════════════════

    # --- 文章页面 ---
    # 旧: /news/show/{id}.html → 新: /news/{id}
    location ~ ^/news/show/(\d+)\.html$ {
        return 301 /news/$1;
    }
    # 旧: /compnew/show/{id}.html → 新: /cases/$1
    location ~ ^/compnew/show/(\d+)\.html$ {
        return 301 /cases/$1;
    }
    # 旧: /ldgh/show/{id}.html → 新: /news/$1 （领导关怀）
    location ~ ^/ldgh/show/(\d+)\.html$ {
        return 301 /news/$1;
    }
    # 旧: /jyzc/show/{id}.html → 新: /news/policy/$1 （教育政策）
    location ~ ^/jyzc/show/(\d+)\.html$ {
        return 301 /news/policy/$1;
    }
    # 旧: /mtnews/show/{id}.html → 新: /news/media/$1 （媒体报道）
    location ~ ^/mtnews/show/(\d+)\.html$ {
        return 301 /news/media/$1;
    }
    # 旧: /sdnews/show/{id}.html → 新: /news/$1
    location ~ ^/sdnews/show/(\d+)\.html$ {
        return 301 /news/$1;
    }

    # --- 案例页面 ---
    # 旧: /xibei/show/{id}.html → 新: /cases/northwest/$1
    location ~ ^/xibei/show/(\d+)\.html$ {
        return 301 /cases/northwest/$1;
    }
    # 旧: /kexue/show/{id}.html → 新: /resources/science/$1
    location ~ ^/kexue/show/(\d+)\.html$ {
        return 301 /resources/science/$1;
    }

    # --- 产品页面 ---
    # 旧: /jjfa/show/{id}.html → 新: /products/solutions/$1
    location ~ ^/jjfa/show/(\d+)\.html$ {
        return 301 /products/solutions/$1;
    }
    # 旧: /hxxl/show/{id}.html → 新: /products/chemistry/$1
    location ~ ^/hxxl/show/(\d+)\.html$ {
        return 301 /products/chemistry/$1;
    }
    # 旧: /jysb/show/{id}.html → 新: /products/equipment/$1
    location ~ ^/jysb/show/(\d+)\.html$ {
        return 301 /products/equipment/$1;
    }

    # === 错误页 ===
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
